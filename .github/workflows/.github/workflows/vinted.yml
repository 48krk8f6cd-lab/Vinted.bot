name: Vinted bot

on:
  schedule:
    - cron: "*/10 * * * *"   # toutes les 10 minutes (GitHub peut retarder un peu)
  workflow_dispatch:          # permet de le lancer à la main pour tester

permissions:
  contents: write

concurrency:
  group: vinted-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Lancer le bot (une passe)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_ONCE: "1"
        run: python bot.py

      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "vinted-bot"
          git config user.email "vinted-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "maj annonces vues" && git push)
